name: build

on:
  push:
    # Calver tags match `<year>.<month>.<day>-<revision>` (e.g. `2026.8.6-1`, `2026.8.6-2`).
    # Pushing such a tag publishes a release whose body IS the annotated tag's
    # message (marked `latest`) — a tag carrying no release notes fails the job.
    # See commits.md "releases" for the maintainer runbook (calver election, the
    # pre-tag binary check, annotating the tag with the notes).
    tags: ['*.*.*-*']
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  # PRs and manual dispatches (without a tag) only verify the build — they do not publish any release assets.
  # This keeps `latest` untouched while still giving reviewers a green/red signal.
  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: cross-compile all targets
        run: zig build dist --prefix .

      - name: smoke test (linux x86_64)
        run: |
          chmod +x bin/agent-detect-linux-x86_64
          ./bin/agent-detect-linux-x86_64 --help
          ./bin/agent-detect-linux-x86_64 --version

      - name: smoke asserts (recipe mode + exit statuses)
        run: |
          set -e
          B=./bin/agent-detect-linux-x86_64
          "$B" trailer co-author --harness=cline --provider=clinepass --model=kimi-k3 >/dev/null
          # the reciprocal-path pin: a combo that resolves reciprocal per the current rule tables (the 2026-09-15 deepseek scandal flag retired the old kilo/deepseek combo)
          test "$("$B" check-reciprocal --harness=kimi-code --provider=chutes --model=glm-5.2)" = "is reciprocal"
          # alias / case-variation resolution must equal the canonical form
          test "$("$B" check-reciprocal --harness='Kilo Code' --provider='Cline Pass' --model='DeepSeek V4 Flash')" = "$("$B" check-reciprocal --harness=kilo --provider=clinepass --model=deepseekv4flash)"
          # unsourced provider training posture (zenmux) with every resolvable conjunct passing → data incomplete (empty stdout, exit 9)
          # (the old cursor/cursor combo went exit-10 when the cursor harness rule landed opt-in)
          set +e
          OUT="$("$B" check-reciprocal --harness=kimi-code --provider=zenmux --model=glm-5.2 2>/dev/null)"
          RC=$?
          set -e
          test "$OUT" = ""
          test "$RC" -eq 9
          # closed model, complete dims → requirement failed (exit 10)
          set +e
          OUT="$("$B" check-reciprocal --harness=kilo --provider=deepseek --model=gpt-5.2 2>/dev/null)"
          RC=$?
          set -e
          test "$OUT" = "not reciprocal"
          test "$RC" -eq 10

  # Pushing a calver-shaped tag (`<year>.<month>.<day>-<revision>`) publishes the release and marks it `latest` (`releases/latest/download/<asset>` resolves there), with the annotated tag's message as the body.
  # The tag name matches the version embedded in `build.zig.zon` exactly (no `v` prefix).
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish release assets
    steps:
      - uses: actions/checkout@v5

      - uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: cross-compile all targets
        run: zig build dist --prefix .

      - name: smoke test (linux x86_64)
        run: |
          chmod +x bin/agent-detect-linux-x86_64
          ./bin/agent-detect-linux-x86_64 --version

      - name: smoke asserts (recipe mode + exit statuses)
        run: |
          set -e
          B=./bin/agent-detect-linux-x86_64
          "$B" trailer co-author --harness=cline --provider=clinepass --model=kimi-k3 >/dev/null
          # the reciprocal-path pin: a combo that resolves reciprocal per the current rule tables (the 2026-09-15 deepseek scandal flag retired the old kilo/deepseek combo)
          test "$("$B" check-reciprocal --harness=kimi-code --provider=chutes --model=glm-5.2)" = "is reciprocal"
          # alias / case-variation resolution must equal the canonical form
          test "$("$B" check-reciprocal --harness='Kilo Code' --provider='Cline Pass' --model='DeepSeek V4 Flash')" = "$("$B" check-reciprocal --harness=kilo --provider=clinepass --model=deepseekv4flash)"
          # unsourced provider training posture (zenmux) with every resolvable conjunct passing → data incomplete (empty stdout, exit 9)
          # (the old cursor/cursor combo went exit-10 when the cursor harness rule landed opt-in)
          set +e
          OUT="$("$B" check-reciprocal --harness=kimi-code --provider=zenmux --model=glm-5.2 2>/dev/null)"
          RC=$?
          set -e
          test "$OUT" = ""
          test "$RC" -eq 9
          # closed model, complete dims → requirement failed (exit 10)
          set +e
          OUT="$("$B" check-reciprocal --harness=kilo --provider=deepseek --model=gpt-5.2 2>/dev/null)"
          RC=$?
          set -e
          test "$OUT" = "not reciprocal"
          test "$RC" -eq 10

      # the annotated tag's message IS the release notes — a naked tag fails
      # the job instead of publishing a bodyless release. git cat-file emits
      # the raw tag object: header, then message, then the SSH/PGP signature
      # armor — the first sed drops the header, the second the armor.
      - name: the release notes come from the tag — a naked tag fails here
        run: |
          notes="$(git cat-file tag "$GITHUB_REF_NAME" | sed '1,/^$/d' | sed '/^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d')"
          if [ "$(printf '%s' "$notes" | wc -c)" -lt 200 ] || ! printf '%s' "$notes" | grep -q "What's changed since"; then
            echo "the tag carries no release notes — nothing was published, so re-cut the tag with them and push again:" >&2
            echo "  git tag -d \"$GITHUB_REF_NAME\" && git push origin :refs/tags/\"$GITHUB_REF_NAME\"" >&2
            echo "  git tag -a \"$GITHUB_REF_NAME\" --cleanup=verbatim -F .release-notes-<version>.md && git push origin \"$GITHUB_REF_NAME\"" >&2
            exit 1
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.md"

      - name: publish tagged release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" bin/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest