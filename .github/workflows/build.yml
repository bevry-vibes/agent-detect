name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish release assets
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: cross-compile all targets
        run: zig build dist --prefix .

      - name: smoke test (linux x86_64)
        run: chmod +x bin/agent-detection-linux-x86_64 && ./bin/agent-detection-linux-x86_64 --help

      - name: publish rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nightly
          body: Rolling build of `agent-detection` binaries for all platforms, updated on every push to `main`. Direct downloads via `releases/latest/download/<asset>`.
          files: bin/*
